# MQTT服务器配置文件
# 服务器配置
server:
  bind_address: "0.0.0.0"  # 绑定地址
  port: 1883  # 监听端口
  max_connections: 10000  # 最大连接数
  backlog: 128  # socket backlog
  thread_count: 2  # 线程数

# MQTT协议配置
# keep_alive_default 已废弃。写进配置会打 WARN，并且不会生效。
mqtt:
  max_packet_size: 1048576  # 最大包大小(字节)。不得超过 memory.client_max_size - 64KiB。CONNACK 通告此值
  keep_alive_max: 3600  # 保活上限(秒)。v5 客户端 Keep Alive 为 0 或超过此值时，CONNACK 带 Server Keep Alive。超时断开在后续条目实现
  connect_timeout_seconds: 10  # 等待 CONNECT 的秒数。只保存配置，超时关闭在后续条目实现
  implicit_no_local: false  # 默认 false。true 是“总是排除发布者”的兼容开关。本项只保存配置，不改变投递
  max_qos: 2  # 最大 QoS。开启持久化时 CONNACK Maximum QoS 不超过 1
  retain_available: true  # CONNACK Retain Available。保留消息库在后续条目实现
  wildcard_subscription_available: true  # CONNACK Wildcard Subscription Available
  subscription_identifier_available: false  # 本版本不实现。设为 true 时启动失败
  shared_subscription_available: false  # 本版本不实现。设为 true 时启动失败
  topic_alias_maximum: 65535  # CONNACK Topic Alias Maximum。别名映射在后续条目实现
  receive_maximum: 65535  # 必须 >= 1。CONNACK Receive Maximum
  allow_mqtt3x: true  # 允许 MQTT 3.1 / 3.1.1 客户端

# 内存配置
memory:
  client_max_size: 1114112  # 1MiB + 64KiB，给最大报文留出每连接状态空间

# 保留消息限额。存储在后续条目实现，这里的值会被读入并冻结。
retain:
  max_messages: 100000
  max_payload_bytes: 1048576  # 默认等于 max_packet_size
  max_total_bytes: 268435456  # 256MiB
  max_deliver_per_subscribe: 1000

# WebSocket服务器配置
# 当前版本通过 server.port 处理 MQTT + WebSocket(HTTP Upgrade)。
# 下面每个键启动时都会 WARN，并被忽略。端口映射请把宿主机 WebSocket 端口转到 server.port。
websocket:
  enabled: true  # 是否启用WebSocket服务器
  bind_address: "127.0.0.1"  # 绑定地址
  port: 18080  # 监听端口
  max_connections: 10000  # 最大连接数
  thread_count: 2  # 线程数
  backlog: 128  # socket backlog
  max_frame_size: 1048576  # 最大帧大小(字节)
  max_message_size: 10485760  # 最大消息大小(字节)
  handshake_timeout: 10  # 握手超时时间(秒)
  ping_interval: 30  # Ping间隔(秒)
  pong_timeout: 10  # Pong超时时间(秒)
  message_format: "mqtt_packet"  # 消息格式: json, mqtt_packet, text_protocol

# 日志配置
log:
  level: "debug"  # 日志级别: trace, debug, info, warn, error, critical
  file_path: "logs/mqtt.log"  # 日志文件路径，空字符串输出到控制台
  max_file_size: 10485760  # 日志文件最大大小(字节)
  max_files: 10  # 最大日志文件数量
  flush_immediately: false  # 立即刷新 

monitoring:
  enabled: true  # 是否启用监控
  interval_seconds: 60  # 监控数据收集间隔(秒) 
  json_output_file: "monitoring_data.json"  # 监控数据输出文件路径，空字符串不输出到文件

# Enable on a local persistent volume for TCP QoS 1 consumers. See docs/persistence.md.
persistence:
  enabled: false
  path: /data/sessions.db
  # This path is now a directory. A legacy SQLite file requires offline migration.
  partitions: 4
  segment_bytes: 16777216
  max_disk_bytes: 4294967296
  checkpoint_interval_ms: 30000
  max_session_expiry_seconds: 86400
  max_sessions: 10000
  max_subscriptions_per_session: 128
  max_messages: 100000
  max_messages_per_session: 10000
  max_bytes_per_session: 33554432
  overflow_policy: reject
  max_bytes: 268435456
  max_requests: 1024
  max_request_bytes: 16777216
  max_inflight: 32
