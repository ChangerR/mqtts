server:
  bind_address: "127.0.0.1"
  port: 1883
  thread_count: 2
mqtt:
  allow_mqtt3x: true
  max_packet_size: 1048576
monitoring:
  enabled: false
auth:
  enabled: true
  allow_anonymous: false
  cache_enabled: false
  providers:
    - type: http
      settings:
        authentication_url: http://127.0.0.1:8080/internal/broker/authentication
        authorization_url: http://127.0.0.1:8080/internal/broker/authorization
        token_env: BROKER_SECURITY_CALLBACK_TOKEN
        timeout_ms: 2000
        message_identity_prefix: "chat/"
